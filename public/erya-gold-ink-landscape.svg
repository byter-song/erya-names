    <path d="M-35 760 C25 714 44 632 84 594 C116 564 139 639 174 632 C214 624 230 395 278 345 C317 304 323 448 358 432 C389 417 384 245 421 205 C457 166 463 330 496 370 C520 398 525 462 558 470 C594 479 607 395 643 382 C681 369 682 554 724 570 C756 582 789 500 828 492 C868 484 888 665 925 690 L1004 690 1004 820 -35 820Z" fill="url(#goldMountain)" opacity=".78"/>
    <path d="M890 730 C942 692 963 612 1006 580 C1035 558 1051 625 1084 620 C1125 614 1145 420 1194 384 C1235 354 1227 481 1265 492 C1302 503 1304 277 1348 244 C1390 212 1383 416 1422 436 C1455 453 1463 501 1502 508 C1543 515 1551 369 1595 350 C1637 332 1639 449 1681 454 C1725 460 1720 313 1768 284 C1810 259 1804 481 1844 498 C1884 515 1906 420 1955 396 L1955 820 890 820Z" fill="url(#middleMountain)" opacity=".74"/>
    <path d="M1110 624 L1194 478 1244 505 1346 260 1388 420 1452 504 1532 373 1588 488 1655 394 1725 520" fill="none" stroke="#e2b653" stroke-width="4" stroke-opacity=".35"/>
    <path d="M90 650 L175 520 225 548 322 320 365 458 418 510 474 392 540 508" fill="none" stroke="#f0c65b" stroke-width="5" stroke-opacity=".42"/>
    <path d="M258 512 C295 454 305 386 323 330 M326 426 C354 382 377 292 414 218 M1190 530 C1222 464 1258 376 1338 255 M1548 506 C1581 449 1618 394 1668 350" fill="none" stroke="#3d2a18" stroke-width="12" stroke-opacity=".16"/>
    <path d="M204 568 C276 542 331 551 404 520 M1110 590 C1200 555 1290 566 1394 526 M1480 570 C1582 538 1702 550 1812 516" fill="none" stroke="#f2d081" stroke-width="7" stroke-opacity=".26"/>
  </g>

  <g opacity=".94" filter="url(#mistBlur)">
    <ellipse cx="460" cy="598" rx="470" ry="60" fill="url(#mist)"/>
    <ellipse cx="1210" cy="545" rx="590" ry="72" fill="url(#mist)"/>
    <ellipse cx="1660" cy="650" rx="430" ry="55" fill="url(#mist)"/>
  </g>

  <path d="M0 680 C220 625 430 676 650 635 C870 594 1020 652 1240 612 C1480 568 1690 628 1920 574 L1920 1080 0 1080Z" fill="url(#water)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-40 780 C280 760 480 808 820 764 S1450 715 1960 756" stroke="#78501d" stroke-width="5" stroke-opacity=".25"/>
    <path d="M30 832 C300 810 510 855 790 828 S1400 780 1870 806" stroke="#d69c31" stroke-width="7" stroke-opacity=".26"/>
    <path d="M210 880 C510 854 770 908 1080 866 S1580 828 1980 860" stroke="#1c1510" stroke-width="9" stroke-opacity=".22"/>
    <path d="M-20 934 C260 910 490 952 780 930 S1330 890 1740 914" stroke="#b17622" stroke-width="4" stroke-opacity=".22"/>
    <path d="M520 1002 C790 976 1060 1010 1430 970" stroke="#21170e" stroke-width="12" stroke-opacity=".18"/>
  </g>

  <g filter="url(#roughNear)">
    <path d="M-40 1080 L-40 790 C12 770 26 704 73 680 C112 660 117 774 151 760 C188 745 191 625 243 590 C290 558 284 694 326 706 C354 715 365 662 398 650 C437 636 432 822 473 840 C505 854 527 797 566 790 C610 781 630 986 670 1080Z" fill="url(#nearMountain)"/>
    <path d="M1320 1080 C1348 1000 1350 860 1390 820 C1425 785 1447 754 1476 750 C1510 746 1491 820 1531 820 C1572 820 1555 674 1602 640 C1646 608 1625 753 1668 758 C1702 762 1700 711 1737 698 C1772 686 1754 834 1795 844 C1828 852 1851 740 1890 730 C1927 721 1921 792 1960 802 L1960 1080Z" fill="url(#nearMountain)" opacity=".92"/>
    <path d="M0 840 C125 804 214 836 342 785 C450 742 535 805 680 748 L680 1080 0 1080Z" fill="#160f0a" opacity=".48"/>
  </g>

  <g stroke="#17100a" stroke-linecap="round" opacity=".7">
    <path d="M1452 760 Q1448 704 1457 664 M1455 695 l-28 -38 M1452 708 l28 -45 M1450 730 l-38 -24 M1455 722 l42 -22" stroke-width="6"/>
    <path d="M1515 790 Q1518 738 1512 700 M1515 738 l-26 -27 M1514 747 l31 -32" stroke-width="4"/>
    <path d="M355 812 Q350 758 359 716 M356 755 l-30 -32 M357 770 l35 -40" stroke-width="5"/>
  </g>
  <g fill="#b87b25" opacity=".58">
    <circle cx="1425" cy="655" r="22"/><circle cx="1478" cy="656" r="27"/><circle cx="1408" cy="690" r="18"/><circle cx="1495" cy="692" r="20"/>
    <circle cx="331" cy="714" r="18"/><circle cx="382" cy="712" r="23"/><circle cx="350" cy="682" r="16"/>
  </g>

  <g fill="#fffaf0" opacity=".44" filter="url(#mistBlur)">
    <ellipse cx="850" cy="694" rx="500" ry="45"/>
    <ellipse cx="1450" cy="725" rx="390" ry="38"/>
  </g>
</svg>
