<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="黑金水墨山水">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e7"/>
      <stop offset="0.6" stop-color="#eee0c8"/>
      <stop offset="1" stop-color="#d7bd8d"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f7d978" stop-opacity=".72"/>
      <stop offset=".45" stop-color="#dfa737" stop-opacity=".24"/>
      <stop offset="1" stop-color="#c3861b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#756754" stop-opacity=".38"/>
      <stop offset="1" stop-color="#a28d6c" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="middleMountain" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#5a4127" stop-opacity=".78"/>
      <stop offset=".55" stop-color="#8b622e" stop-opacity=".52"/>
      <stop offset="1" stop-color="#b8883b" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="nearMountain" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#17110c" stop-opacity=".92"/>
      <stop offset=".58" stop-color="#3e2a18" stop-opacity=".78"/>
      <stop offset="1" stop-color="#8f642a" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="goldMountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c65b" stop-opacity=".78"/>
      <stop offset=".5" stop-color="#bd7c1c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#6e4514" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9ea" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#d9ba7c" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8a622e" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0"/>
      <stop offset=".2" stop-color="#fffaf0" stop-opacity=".88"/>
      <stop offset=".78" stop-color="#fffaf0" stop-opacity=".82"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </linearGradient>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="3" seed="27" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
      <feComponentTransfer in="grey" result="softNoise">
        <feFuncA type="table" tableValues="0 .065"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <filter id="roughFar" x="-10%" y="-15%" width="120%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .018" numOctaves="3" seed="12" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="18" xChannelSelector="R" yChannelSelector="B"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="roughMiddle" x="-10%" y="-15%" width="120%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .024" numOctaves="4" seed="31" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="roughNear" x="-10%" y="-15%" width="120%" height="130%">
      <feTurbulence type="turbulence" baseFrequency=".018 .036" numOctaves="3" seed="47" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="9" xChannelSelector="B" yChannelSelector="R"/>
    </filter>
    <filter id="mistBlur" x="-15%" y="-100%" width="130%" height="300%">
      <feGaussianBlur stdDeviation="25 10"/>
    </filter>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="#fff9eb" opacity=".18" filter="url(#paper)"/>
  <circle cx="1245" cy="205" r="150" fill="url(#sun)"/>
  <circle cx="1245" cy="205" r="54" fill="#e7b94d" opacity=".2" filter="url(#goldGlow)"/>

  <g filter="url(#roughFar)">
    <path d="M0 540 C82 492 104 445 152 430 C196 417 208 482 254 472 C298 462 322 355 369 338 C414 322 425 451 478 455 C526 459 532 296 586 274 C640 253 650 424 706 432 C752 438 770 361 815 345 C860 329 881 468 932 474 C982 480 1005 345 1054 326 C1101 308 1121 448 1176 454 C1230 460 1243 310 1302 292 C1356 275 1367 415 1421 420 C1473 425 1491 316 1548 300 C1602 284 1618 439 1673 444 C1728 450 1751 340 1810 326 C1864 313 1885 406 1920 430 L1920 690 0 690Z" fill="url(#farMountain)"/>
    <path d="M0 565 C160 480 250 510 390 430 C545 340 625 430 760 380 C895 330 968 420 1090 360 C1220 292 1300 390 1430 336 C1580 270 1700 380 1920 310 L1920 620 0 620Z" fill="#756855" opacity=".12"/>
  </g>

