<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erya Names - Light Theme Prototypes</title>
    <style>
      /* =========================================
       Global Reset & Switcher
       ========================================= */
      :root {
        --font-sans:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        --font-serif:
          "Songti SC", "Times New Roman", serif; /* 移除自定义字体依赖，确保稳定渲染 */
        --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-sans);
        min-height: 100vh;
        transition: background 0.5s;
        overflow-x: hidden;
      }

      .switcher {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        z-index: 9999;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }
      .concept-btn {
        background: transparent;
        border: 1px solid rgba(0, 0, 0, 0.1);
        color: #333;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.3s;
      }
      .concept-btn.active,
      .concept-btn:hover {
        background: #000;
        color: #fff;
      }

      #app-root {
        margin-top: 60px;
        min-height: calc(100vh - 60px);
        display: flex;
        width: 100%;
      }

      /* =========================================
       Concept 1: 现代版式 / 杂志风 (Editorial)
       ========================================= */
      .c1-body {
        background: #f4f0ea;
        color: #111;
      }
      .c1-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 300px 1fr;
        border-left: 2px solid #111;
        border-right: 2px solid #111;
        min-height: calc(100vh - 60px);
      }
      .c1-sidebar {
        border-right: 2px solid #111;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
      }
      .c1-title {
        font-family: var(--font-serif);
        font-size: 64px;
        line-height: 1;
        border-bottom: 8px solid #111;
        padding-bottom: 20px;
        margin-bottom: 40px;
      }
      .c1-main {
        padding: 40px;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      .c1-name-display {
        border: 2px solid #111;
        padding: 60px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .c1-name-display h2 {
        font-family: var(--font-serif);
        font-size: 120px;
        letter-spacing: 20px;
        margin-left: 20px;
      }
      .c1-btn {
        background: #111;
        color: #f4f0ea;
        border: none;
        padding: 16px 24px;
        font-size: 16px;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      .c1-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #d94f33;
        transform: translateY(100%);
        transition: transform 0.3s var(--ease-out);
        z-index: 1;
      }
      .c1-btn span {
        position: relative;
        z-index: 2;
      }
      .c1-btn:hover::after {
        transform: translateY(0);
      }
      .c1-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 40px;
      }
      .c1-box {
        border-top: 2px solid #111;
        padding-top: 16px;
      }
      .c1-box-title {
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 12px;
      }

      /* =========================================
       Concept 2: 白玉玻璃态 (Spatial Light) 🏆
       ========================================= */
      .c2-body {
        background: #f8f9fa;
        color: #1e293b;
        overflow: hidden;
      }
      .c2-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.1), transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.1), transparent 50%);
        filter: blur(60px);
        animation: c2-breathe 10s infinite alternate;
      }
      @keyframes c2-breathe {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(1.1);
        }
      }
      .c2-container {
        width: 100%;
        max-width: 1000px;
        margin: 40px auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 0 20px;
      }
      .c2-glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(24px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.03),
          inset 0 1px 0 rgba(255, 255, 255, 1);
        border-radius: 24px;
        padding: 32px;
        transition:
          transform 0.4s var(--ease-spring),
          box-shadow 0.4s var(--ease-spring);
      }
      .c2-glass:hover {
        transform: translateY(-4px);
        box-shadow:
          0 30px 50px rgba(0, 0, 0, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 1);
      }
      .c2-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .c2-title {
        font-family: var(--font-serif);
        font-size: 32px;
        color: #0f172a;
      }
      .c2-content {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 24px;
      }
      .c2-name-card {
        text-align: center;
        padding: 60px 0;
      }
      .c2-name-card h2 {
        font-family: var(--font-serif);
        font-size: 80px;
        color: #0f172a;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        margin-bottom: 20px;
      }
      .c2-btn {
        background: #0f172a;
        color: #fff;
        border: none;
        padding: 14px 28px;
        border-radius: 100px;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 10px 20px rgba(15, 23, 42, 0.2);
      }
      .c2-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 15px 25px rgba(15, 23, 42, 0.3);
      }
      .c2-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .c2-list-item {
        background: rgba(255, 255, 255, 0.5);
        padding: 16px;
        border-radius: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.6);
        transition: background 0.3s;
        cursor: default;
      }
      .c2-list-item:hover {
        background: rgba(255, 255, 255, 0.9);
      }

      /* =========================================
       Concept 3: 极简禅意 (Zen Minimal)
       ========================================= */
      .c3-body {
        background: #ffffff;
        color: #333;
      }
      .c3-container {
        width: 100%;
        max-width: 800px;
        margin: 100px auto;
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .c3-title {
        font-family: var(--font-serif);
        font-size: 24px;
        letter-spacing: 4px;
        color: #999;
        margin-bottom: 80px;
      }
      .c3-name {
        font-family: var(--font-serif);
        font-size: 100px;
        font-weight: normal;
        margin-bottom: 40px;
        position: relative;
      }
      .c3-desc {
        max-width: 500px;
        text-align: center;
        font-size: 15px;
        line-height: 2;
        color: #666;
        margin-bottom: 80px;
      }
      .c3-data {
        width: 100%;
        display: flex;
        justify-content: space-around;
        border-top: 1px solid #eee;
        padding-top: 40px;
      }
      .c3-data-item {
        text-align: center;
      }
      .c3-data-val {
        font-size: 24px;
        color: #111;
        margin-bottom: 8px;
      }
      .c3-data-label {
        font-size: 12px;
        color: #999;
        letter-spacing: 1px;
      }
      .c3-btn {
        background: transparent;
        border: none;
        color: #111;
        font-size: 16px;
        cursor: pointer;
        padding-bottom: 4px;
        border-bottom: 1px solid transparent;
        transition: border-color 0.3s;
      }
      .c3-btn:hover {
        border-bottom-color: #111;
      }

      /* =========================================
       Concept 4: 素坯雕刻 (Neumorphism / Clay)
       ========================================= */
      .c4-body {
        background: #e0e5ec;
        color: #4a5568;
      }
      .c4-container {
        width: 100%;
        max-width: 900px;
        margin: 60px auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        padding: 0 20px;
      }
      .c4-panel {
        background: #e0e5ec;
        border-radius: 30px;
        box-shadow:
          9px 9px 16px rgb(163, 177, 198, 0.6),
          -9px -9px 16px rgba(255, 255, 255, 0.5);
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .c4-panel-inset {
        background: #e0e5ec;
        border-radius: 20px;
        box-shadow:
          inset 6px 6px 10px 0 rgba(163, 177, 198, 0.6),
          inset -6px -6px 10px 0 rgba(255, 255, 255, 0.5);
        padding: 30px;
        width: 100%;
      }
      .c4-name {
        font-family: var(--font-serif);
        font-size: 64px;
        color: #2d3748;
        margin-bottom: 20px;
      }
      .c4-btn {
        background: #e0e5ec;
        color: #4a5568;
        border: none;
        padding: 16px 32px;
        border-radius: 50px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow:
          6px 6px 10px 0 rgba(163, 177, 198, 0.6),
          -6px -6px 10px 0 rgba(255, 255, 255, 0.5);
        transition: box-shadow 0.2s;
      }
      .c4-btn:active {
        box-shadow:
          inset 4px 4px 6px 0 rgba(163, 177, 198, 0.6),
          inset -4px -4px 6px 0 rgba(255, 255, 255, 0.5);
      }
      .c4-progress {
        height: 12px;
        border-radius: 6px;
        box-shadow:
          inset 3px 3px 6px rgba(163, 177, 198, 0.6),
          inset -3px -3px 6px rgba(255, 255, 255, 0.5);
        width: 100%;
        margin-top: 10px;
        overflow: hidden;
      }
      .c4-progress-bar {
        height: 100%;
        background: #a0aec0;
        border-radius: 6px;
        width: 85%;
      }

      /* =========================================
       Concept 5: 层叠画卷 (Layered Canvas)
       ========================================= */
      .c5-body {
        background: #fafafa;
        color: #2c3e50;
      }
      .c5-container {
        width: 100%;
        max-width: 1000px;
        margin: 80px auto;
        position: relative;
        height: 600px;
      }
      .c5-card {
        position: absolute;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
        transition: transform 0.5s var(--ease-spring);
        border: 1px solid #f0f0f0;
      }
      .c5-card-1 {
        width: 400px;
        height: 500px;
        left: 50px;
        top: 0;
        z-index: 2;
        transform-origin: left center;
      }
      .c5-card-2 {
        width: 500px;
        height: 400px;
        right: 50px;
        top: 50px;
        z-index: 1;
        background: #f5f7fa;
      }
      .c5-container:hover .c5-card-1 {
        transform: rotateY(-15deg) translateX(-20px);
      }
      .c5-container:hover .c5-card-2 {
        transform: translateX(30px);
      }
      .c5-name {
        font-family: var(--font-serif);
        font-size: 80px;
        margin-bottom: 20px;
      }
      .c5-tag {
        display: inline-block;
        padding: 6px 12px;
        background: #e2e8f0;
        border-radius: 4px;
        font-size: 13px;
        margin-right: 8px;
        margin-bottom: 8px;
      }
      .c5-btn {
        background: #3182ce;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="switcher">
      <button class="concept-btn active" onclick="render(1)">1. 现代杂志 (Editorial)</button>
      <button class="concept-btn" onclick="render(2)">2. 白玉玻璃态 (Spatial) 🏆</button>
      <button class="concept-btn" onclick="render(3)">3. 极简禅意 (Zen)</button>
      <button class="concept-btn" onclick="render(4)">4. 素坯拟物 (Neumorphism)</button>
      <button class="concept-btn" onclick="render(5)">5. 层叠画卷 (Layered)</button>
    </div>

    <div id="app-root"></div>

    <!-- 将模板直接写在 DOM 中而不是 JS 字符串里，避免解析错误导致白屏 -->
    <template id="tpl-1">
      <div class="c1-container">
        <aside class="c1-sidebar">
          <h1 class="c1-title">尔雅<br />起名</h1>
          <p style="margin-bottom: auto; line-height: 1.6; opacity: 0.7">
            打破常规网格。<br />强调黑白灰与粗线条对比。<br />适合极其严谨、结构化的信息展示。
          </p>
          <button class="c1-btn"><span>生成新候选 &rarr;</span></button>
        </aside>
        <main class="c1-main">
          <div class="c1-name-display">
            <div style="position: absolute; top: 20px; left: 20px; font-weight: bold">
              NO. 001
            </div>
            <h2>宋泽谦</h2>
            <p style="margin-top: 20px; font-size: 18px; font-style: italic">
              "温润如水，谦和有礼"
            </p>
          </div>
          <div class="c1-grid">
            <div class="c1-box">
              <div class="c1-box-title">五格剖象</div>
              <div style="font-size: 32px; font-weight: bold">
                天格 85 <span style="color: #d94f33; font-size: 16px">吉</span>
              </div>
              <div style="font-size: 32px; font-weight: bold">
                地格 90 <span style="color: #d94f33; font-size: 16px">大吉</span>
              </div>
            </div>
            <div class="c1-box">
              <div class="c1-box-title">八字喜用</div>
              <p style="line-height: 1.6">
                此命五行缺水，泽字补水。谦字属木，水生木，五行相生，格局顺畅。
              </p>
            </div>
          </div>
        </main>
      </div>
    </template>

    <template id="tpl-2">
      <div class="c2-bg"></div>
      <div class="c2-container">
        <header class="c2-glass c2-header" style="padding: 16px 32px">
          <div class="c2-title">尔雅 Erya</div>
          <button class="c2-btn">开始生成</button>
        </header>
        <main class="c2-content">
          <div class="c2-glass c2-name-card">
            <div
              style="
                font-size: 14px;
                opacity: 0.5;
                text-transform: uppercase;
                letter-spacing: 2px;
                margin-bottom: 20px;
              "
            >
              Current Candidate
            </div>
            <h2>宋泽谦</h2>
            <p style="color: #475569; max-width: 400px; margin: 0 auto; line-height: 1.8">
              温润如玉，谦谦君子。<br />底层是极其柔和的极光色块，表层是厚重的白色毛玻璃。通过阴影营造悬浮感。
            </p>
          </div>
          <div class="c2-glass">
            <h3 style="margin-bottom: 20px; font-size: 16px">数据面板</h3>
            <div class="c2-list">
              <div class="c2-list-item">
                <span style="font-weight: bold">天格 (金)</span>
                <span
                  style="
                    color: #059669;
                    background: #d1fae5;
                    padding: 4px 8px;
                    border-radius: 8px;
                    font-size: 12px;
                  "
                  >85 吉</span
                >
              </div>
              <div class="c2-list-item">
                <span style="font-weight: bold">人格 (水)</span>
                <span
                  style="
                    color: #2563eb;
                    background: #dbeafe;
                    padding: 4px 8px;
                    border-radius: 8px;
                    font-size: 12px;
                  "
                  >95 大吉</span
                >
              </div>
              <div class="c2-list-item">
                <span style="font-weight: bold">地格 (木)</span>
                <span
                  style="
                    color: #059669;
                    background: #d1fae5;
                    padding: 4px 8px;
                    border-radius: 8px;
                    font-size: 12px;
                  "
                  >80 吉</span
                >
              </div>
            </div>
          </div>
        </main>
      </div>
    </template>

    <template id="tpl-3">
      <div class="c3-container">
        <div class="c3-title">尔雅 · 极简工作台</div>
        <h1 class="c3-name">宋泽谦</h1>
        <p class="c3-desc">
          抛弃一切冗余的容器和边框。<br />
          依靠纯粹的文字排版、大小对比和极其奢侈的留白来划分信息层级。<br />
          交互如水波般平静。
        </p>
        <div style="margin-bottom: 80px">
          <button class="c3-btn">加入重点候选</button>
          <button class="c3-btn" style="margin-left: 20px; color: #999">重新生成</button>
        </div>
        <div class="c3-data">
          <div class="c3-data-item">
            <div class="c3-data-val">85</div>
            <div class="c3-data-label">天格</div>
          </div>
          <div class="c3-data-item">
            <div class="c3-data-val">95</div>
            <div class="c3-data-label">人格</div>
          </div>
          <div class="c3-data-item">
            <div class="c3-data-val">80</div>
            <div class="c3-data-label">地格</div>
          </div>
          <div class="c3-data-item">
            <div class="c3-data-val">水木</div>
            <div class="c3-data-label">喜用神</div>
          </div>
        </div>
      </div>
    </template>

    <template id="tpl-4">
      <div class="c4-container">
        <div class="c4-panel">
          <h1 class="c4-name">宋泽谦</h1>
          <p style="text-align: center; line-height: 1.8; margin-bottom: 40px">
            模拟未上釉的素坯白瓷（Neumorphism）。<br />
            所有元素都是背景本身的凸起或凹陷，<br />触觉反馈极其真实。
          </p>
          <button class="c4-btn">点击按压体验</button>
        </div>
        <div class="c4-panel" style="justify-content: flex-start">
          <h3 style="margin-bottom: 30px; font-size: 20px">属性解析</h3>
          <div class="c4-panel-inset" style="margin-bottom: 20px">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px">
              <strong>天格契合度</strong> <span>85%</span>
            </div>
            <div class="c4-progress"><div class="c4-progress-bar"></div></div>
          </div>
          <div class="c4-panel-inset">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px">
              <strong>人格契合度</strong> <span>95%</span>
            </div>
            <div class="c4-progress">
              <div class="c4-progress-bar" style="width: 95%"></div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template id="tpl-5">
      <div class="c5-container">
        <div class="c5-card c5-card-1">
          <div style="font-size: 12px; color: #999; margin-bottom: 20px">焦点候选</div>
          <h1 class="c5-name">宋泽谦</h1>
          <p style="line-height: 1.8; color: #666; margin-bottom: 30px">
            打破平面的束缚，将不同维度的信息做成独立的卡片互相层叠。<br />
            请将鼠标悬浮在此区域，感受物理层级的错开。
          </p>
          <button class="c5-btn">选定此名</button>
        </div>
        <div class="c5-card c5-card-2">
          <h3 style="margin-bottom: 20px">深度解析 (被遮挡层)</h3>
          <div class="c5-tag">五行缺水</div>
          <div class="c5-tag">木火通明</div>
          <div class="c5-tag">天格吉</div>
          <div class="c5-tag">三才相生</div>
          <p style="margin-top: 20px; font-size: 14px; line-height: 1.8; color: #666">
            底层卡片承载辅助信息。当用户需要深入了解时，通过 Hover
            或点击将顶层卡片移开。这种交互非常适合“总-分”结构的工作台。
          </p>
        </div>
      </div>
    </template>

    <script>
      function render(num) {
        // 切换按钮状态
        document.querySelectorAll(".concept-btn").forEach(function (btn, idx) {
          if (idx === num - 1) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });
        // 切换 Body Class 控制背景
        document.body.className = "c" + num + "-body";

        // 使用 template 标签内容填充，避免内联 JS 字符串解析错误
        var templateId = "tpl-" + num;
        var template = document.getElementById(templateId);
        var appRoot = document.getElementById("app-root");
        appRoot.innerHTML = "";
        if (template) {
          appRoot.appendChild(template.content.cloneNode(true));
        }
      }

      // 初始化渲染
      document.addEventListener("DOMContentLoaded", function () {
        render(1); // 默认渲染方案 1
      });
    </script>
  </body>
</html>
