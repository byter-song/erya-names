<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>尔雅 | 滴水生漪 (Water Ripple)</title>
    <style>
      :root {
        --sys-font:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        --sys-font-serif: "Songti SC", "STSong", "SimSun", serif;
        --paper: #fefdfb;
      }
      body {
        margin: 0;
        background: var(--paper);
        font-family: var(--sys-font);
        height: 100vh;
        overflow: hidden;
        position: relative;
      }

      .ripple {
        position: absolute;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: rippleAnim 2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }
      @keyframes rippleAnim {
        0% {
          width: 0;
          height: 0;
          opacity: 1;
          border-width: 2px;
        }
        100% {
          width: 500px;
          height: 500px;
          opacity: 0;
          border-width: 0px;
        }
      }

      .layout {
        display: flex;
        height: 100vh;
        position: relative;
        z-index: 10;
      }
      .sidebar {
        width: 320px;
        padding: 40px;
        border-right: 1px solid rgba(0, 0, 0, 0.05);
      }
      .main {
        flex: 1;
        padding: 60px;
      }

      .generate-btn {
        background: #fff;
        border: 1px solid #ddd;
        padding: 12px 24px;
        border-radius: 30px;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 20px;
        transition: all 0.3s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      }
      .generate-btn:hover {
        border-color: #333;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      .card {
        display: inline-block;
        padding: 20px 30px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 12px;
        margin: 0 20px 20px 0;
        backdrop-filter: blur(10px);
        cursor: pointer;
        transition: transform 0.3s;
      }
      .card:hover {
        transform: translateY(-5px);
      }
      .card-name {
        font-family: var(--sys-font-serif);
        font-size: 2rem;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="sidebar">
        <h1 style="font-family: var(--sys-font-serif); margin-top: 0">尔雅</h1>
        <p style="color: #888">点击生成，感受水波纹的反馈动画。</p>
        <button class="generate-btn" id="genBtn">凝神起名</button>
      </div>
      <div class="main" id="mainArea">
        <!-- Cards will be injected here -->
      </div>
    </div>

    <script>
      document.body.addEventListener("click", function (e) {
        const ripple = document.createElement("div");
        ripple.className = "ripple";
        ripple.style.left = e.clientX + "px";
        ripple.style.top = e.clientY + "px";
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 2000);
      });

      const names = [
        { n: "林子衿", d: "青青子衿，悠悠我心" },
        { n: "林若华", d: "羲和之未扬，若华何光" },
        { n: "林望舒", d: "前望舒使先驱兮" },
      ];

      document.getElementById("genBtn").addEventListener("click", (e) => {
        const main = document.getElementById("mainArea");
        main.innerHTML = ""; // clear
        names.forEach((item, index) => {
          setTimeout(() => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<div class="card-name">${item.n}</div><div style="font-size:0.9rem; color:#666;">${item.d}</div>`;
            card.style.animation = "rippleAnim 0.5s reverse"; // simple enter anim
            main.appendChild(card);
          }, index * 150);
        });
        e.stopPropagation(); // prevent body click
      });
    </script>
  </body>
</html>
