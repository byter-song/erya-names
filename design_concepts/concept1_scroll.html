<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>尔雅 | 画卷展开</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Noto+Serif+SC:wght@300;400&display=swap");

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        background-color: #e9e4d4; /* 宣纸色 */
        color: #1a1a1a;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: flex-end; /* 从右向左排版 */
        writing-mode: vertical-rl;
        padding-right: 10vw;
        box-sizing: border-box;
      }

      .paper-texture {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: url("https://images.unsplash.com/photo-1606707764421-26c71c469b61?q=80&w=2000&auto=format&fit=crop")
          no-repeat center/cover;
        opacity: 0.15;
        z-index: -1;
        mix-blend-mode: multiply;
      }

      h1 {
        font-family: "Zhi Mang Xing", cursive;
        font-size: 8rem;
        margin: 0 40px;
        letter-spacing: 2rem;
        position: relative;
        /* 卷轴展开动画效果 */
        clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
        animation: scrollReveal 3s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
      }

      .subtitle {
        font-family: "Noto Serif SC", serif;
        font-size: 1.5rem;
        font-weight: 300;
        line-height: 2;
        letter-spacing: 0.5rem;
        opacity: 0;
        transform: translateX(20px);
        animation: fadeUp 2s 2s ease-out forwards;
      }

      .red-seal {
        width: 50px;
        height: 50px;
        border: 2px solid #b32a2a;
        color: #b32a2a;
        font-family: "Zhi Mang Xing", cursive;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        margin-top: 50px;
        writing-mode: horizontal-tb;
        opacity: 0;
        animation: stamp 0.5s 3.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      .input-group {
        margin-right: 80px;
        opacity: 0;
        animation: fadeUp 2s 4s ease-out forwards;
        display: flex;
        align-items: center;
      }

      input {
        writing-mode: vertical-rl;
        background: transparent;
        border: none;
        border-left: 1px solid #333;
        padding: 10px 0;
        font-family: "Noto Serif SC", serif;
        font-size: 1.2rem;
        outline: none;
        height: 200px;
        color: #333;
      }

      input::placeholder {
        color: #888;
      }

      @keyframes scrollReveal {
        to {
          clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes stamp {
        0% {
          transform: scale(2);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div class="paper-texture"></div>
    <h1>尔雅</h1>
    <div class="subtitle">
      <p>辞以达意，名以正言。</p>
      <p>溯源经典，赐子佳名。</p>
      <div class="red-seal">天赐</div>
    </div>
    <div class="input-group">
      <input type="text" placeholder="请输入姓氏或期许..." />
    </div>
  </body>
</html>
