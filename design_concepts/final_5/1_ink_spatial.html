<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>尔雅 · 墨启空间</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600&display=swap");

      :root {
        --paper: #faf8f3;
        --paper-2: #f2efe6;
        --ink: #1b1b18;
        --ink-2: #5c5a52;
        --ink-3: #9a968a;
        --gold: #b08d57;
        --gold-soft: rgba(176, 141, 87, 0.14);
        --cinnabar: #a94e3c;
        --glass: rgba(255, 255, 255, 0.62);
        --spring: cubic-bezier(0.16, 1, 0.3, 1);
        --serif: "Noto Serif SC", serif;
        --brush: "Ma Shan Zheng", cursive;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--serif);
        color: var(--ink);
        background: var(--paper);
        overflow: hidden;
        position: relative;
      }

      /* —— 呼吸水墨环境层 —— */
      .ambient {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .ambient span {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.5;
      }
      .ambient .a1 {
        width: 46vw;
        height: 46vw;
        left: -10vw;
        top: -14vw;
        background: radial-gradient(circle, rgba(0, 0, 0, 0.07), transparent 65%);
        animation: drift 16s ease-in-out infinite alternate;
      }
      .ambient .a2 {
        width: 40vw;
        height: 40vw;
        right: -12vw;
        bottom: -16vw;
        background: radial-gradient(circle, rgba(176, 141, 87, 0.2), transparent 65%);
        animation: drift 20s ease-in-out infinite alternate-reverse;
      }
      .ambient .ring {
        position: absolute;
        right: 6vw;
        top: 10vh;
        width: 34vw;
        height: 34vw;
        border: 1px solid rgba(176, 141, 87, 0.35);
        border-radius: 50%;
        transform: rotate(-20deg) scaleY(0.7);
        opacity: 0.5;
        animation: spin 60s linear infinite;
      }
      .ambient .ring::before {
        content: "";
        position: absolute;
        top: 10%;
        left: 6%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 20px var(--gold);
      }
      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vw, 3vw) scale(1.12);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(340deg) scaleY(0.7);
        }
      }

      /* —— 起始 Hero（Morph 起点）—— */
      .hero {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(620px, 90vw);
        text-align: center;
        z-index: 30;
        transition:
          top 1.05s var(--spring),
          transform 1.05s var(--spring),
          opacity 0.6s;
      }
      .hero.up {
        top: 6vh;
        transform: translate(-50%, 0) scale(0.72);
      }
      .brand {
        font-family: var(--brush);
        font-size: 5rem;
        line-height: 1;
        margin-bottom: 14px;
      }
      .brand small {
        display: block;
        font-family: var(--serif);
        font-size: 0.85rem;
        letter-spacing: 0.6em;
        color: var(--ink-2);
        margin-top: 18px;
        font-weight: 400;
      }
      .prompt {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--glass);
        border: 1px solid rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
        border-radius: 46px;
        padding: 8px 8px 8px 26px;
        box-shadow: 0 24px 60px rgba(40, 34, 20, 0.1);
      }
      .prompt input {
        flex: 1;
        border: none;
        background: none;
        outline: none;
        font-family: var(--serif);
        font-size: 1.1rem;
        color: var(--ink);
      }
      .prompt input::placeholder {
        color: var(--ink-3);
      }
      .prompt button {
        width: 52px;
        height: 52px;
        border: none;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        font-size: 1.3rem;
        cursor: pointer;
        transition:
          transform 0.3s,
          background 0.3s;
      }
      .prompt button:hover {
        transform: scale(1.08);
        background: var(--gold);
      }

      /* —— 工作区 —— */
      .stage-head {
        position: fixed;
        top: 7vh;
        left: 0;
        right: 0;
        text-align: center;
        z-index: 15;
        opacity: 0;
        transform: translateY(-12px);
        transition: 0.7s var(--spring) 0.2s;
        pointer-events: none;
      }
      body.started .stage-head {
        opacity: 1;
        transform: none;
      }
      .stage-head .crumb {
        font-size: 0.8rem;
        letter-spacing: 0.4em;
        color: var(--ink-3);
        margin-bottom: 8px;
      }
      .stage-head h2 {
        font-weight: 500;
        font-size: 1.5rem;
        letter-spacing: 0.15em;
      }

      .workspace {
        position: fixed;
        inset: 0;
        z-index: 10;
        padding: 17vh 6vw 14vh;
        perspective: 1400px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 26px;
        align-content: start;
      }
      .card {
        position: relative;
        background: var(--glass);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 22px;
        padding: 34px 28px 30px;
        cursor: pointer;
        opacity: 0;
        transform: translateZ(-260px) translateY(70px) rotateX(14deg);
        transition:
          opacity 0.8s var(--spring),
          transform 0.9s var(--spring),
          box-shadow 0.4s,
          border-color 0.4s;
      }
      body.started .card {
        opacity: 1;
        transform: none;
      }
      .card:hover {
        box-shadow: 0 30px 60px rgba(40, 34, 20, 0.12);
        border-color: var(--gold);
        transform: translateY(-6px);
      }
      .pinyin {
        font-size: 0.78rem;
        letter-spacing: 0.28em;
        color: var(--gold);
        text-transform: uppercase;
      }
      .cname {
        font-family: var(--brush);
        font-size: 3.2rem;
        margin: 8px 0 6px;
      }
      .cline {
        font-size: 0.9rem;
        color: var(--ink-2);
        line-height: 1.6;
      }
      .pick {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1.5px solid var(--ink-3);
        display: grid;
        place-items: center;
        font-size: 0.75rem;
        color: transparent;
        transition: 0.3s;
      }
      .card.kept {
        border-color: var(--gold);
        background: var(--gold-soft);
      }
      .card.kept .pick {
        background: var(--gold);
        border-color: var(--gold);
        color: #fff;
      }

      /* —— 灵动岛阶段 —— */
      .island {
        position: fixed;
        left: 50%;
        bottom: 34px;
        transform: translate(-50%, 140%);
        background: #16150f;
        padding: 8px;
        border-radius: 40px;
        display: flex;
        gap: 6px;
        z-index: 40;
        transition: transform 0.9s var(--spring) 0.5s;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      body.started .island {
        transform: translate(-50%, 0);
      }
      .island button {
        border: none;
        background: transparent;
        color: #cfcabb;
        font-family: var(--serif);
        font-size: 0.9rem;
        padding: 11px 24px;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.3s;
        letter-spacing: 0.08em;
      }
      .island button.on {
        background: var(--gold);
        color: #fff;
      }

      /* 精选阶段：未选隐藏，选中放大重排 */
      body.shortlist .grid {
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      }
      body.shortlist .card:not(.kept) {
        opacity: 0 !important;
        transform: scale(0.8) !important;
        pointer-events: none;
        position: absolute;
        visibility: hidden;
      }
      body.shortlist .card.kept {
        animation: pop 0.6s var(--spring);
      }
      @keyframes pop {
        0% {
          transform: scale(0.92);
        }
        60% {
          transform: scale(1.04);
        }
        100% {
          transform: scale(1);
        }
      }

      /* —— 详情全屏层：点击任意处返回 —— */
      .detail {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(250, 248, 243, 0.82);
        backdrop-filter: blur(28px);
        opacity: 0;
        pointer-events: none;
        cursor: pointer;
        transition: opacity 0.5s;
      }
      .detail.show {
        opacity: 1;
        pointer-events: auto;
      }
      .detail-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 6vh 6vw;
        transform: scale(0.9) translateY(40px);
        transition: transform 0.7s var(--spring);
      }
      .detail.show .detail-inner {
        transform: none;
      }
      .d-seal {
        font-family: var(--brush);
        color: var(--cinnabar);
        font-size: 1.2rem;
        border: 2px solid var(--cinnabar);
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        margin-bottom: 26px;
        opacity: 0.85;
      }
      .d-pinyin {
        letter-spacing: 0.4em;
        color: var(--gold);
        font-size: 1rem;
        margin-bottom: 10px;
      }
      .d-name {
        font-family: var(--brush);
        font-size: clamp(5rem, 14vw, 9rem);
        line-height: 1.1;
      }
      .d-src {
        margin-top: 30px;
        color: var(--ink-2);
        font-size: 1.15rem;
        line-height: 2;
        max-width: 640px;
      }
      .d-tags {
        display: flex;
        gap: 10px;
        margin-top: 34px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .d-tags span {
        font-size: 0.8rem;
        padding: 7px 16px;
        border: 1px solid rgba(176, 141, 87, 0.5);
        border-radius: 30px;
        color: var(--gold);
      }
      .d-back {
        position: absolute;
        bottom: 5vh;
        left: 0;
        right: 0;
        color: var(--ink-3);
        font-size: 0.85rem;
        letter-spacing: 0.3em;
        animation: blink 2.2s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient">
      <span class="a1"></span><span class="a2"></span><span class="ring"></span>
    </div>

    <div class="stage-head">
      <div class="crumb">林 氏 · 命 名 进 行 中</div>
      <h2 id="headTitle">初筛候选 · 引经据典</h2>
    </div>

    <section class="hero" id="hero">
      <div class="brand">尔雅<small>辞 以 达 意 · 名 以 正 言</small></div>
      <div class="prompt">
        <input
          id="q"
          placeholder="输入期许，如：温润如玉、见贤思齐"
          value="温润如玉 气宇轩昂"
        />
        <button id="go">启</button>
      </div>
    </section>

    <main class="workspace"><div class="grid" id="grid"></div></main>

    <nav class="island">
      <button class="on" data-stage="all" id="tAll">初筛生成 · <b id="cnt">6</b></button>
      <button data-stage="short" id="tShort">决断留存 · <b id="keptCnt">0</b></button>
    </nav>

    <div class="detail" id="detail">
      <div class="detail-inner">
        <div class="d-seal">尔雅</div>
        <div class="d-pinyin" id="dPinyin"></div>
        <div class="d-name" id="dName"></div>
        <div class="d-src" id="dSrc"></div>
        <div class="d-tags" id="dTags"></div>
        <div class="d-back">继 续 点 击 任 意 处 返 回</div>
      </div>
    </div>

    <script>
      const DATA = [
        {
          n: "林子衿",
          p: "Lin Zi Jin",
          s: "青青子衿，悠悠我心。纵我不往，子宁不嗣音。",
          src: "《诗经 · 郑风 · 子衿》",
          tags: ["学识", "倾慕", "经典"],
        },
        {
          n: "林若华",
          p: "Lin Ruo Hua",
          s: "羲和之未扬，若华何光？何所冬暖，何所夏寒。",
          src: "《楚辞 · 天问》",
          tags: ["光华", "朝气", "神话"],
        },
        {
          n: "林望舒",
          p: "Lin Wang Shu",
          s: "前望舒使先驱兮，后飞廉使奔属。",
          src: "《楚辞 · 离骚》",
          tags: ["迎光", "月神", "清雅"],
        },
        {
          n: "林清婉",
          p: "Lin Qing Wan",
          s: "有美一人，清扬婉兮。邂逅相遇，适我愿兮。",
          src: "《诗经 · 郑风 · 野有蔓草》",
          tags: ["温婉", "柔美"],
        },
        {
          n: "林嘉木",
          p: "Lin Jia Mu",
          s: "南有嘉木，葛藟累之。乐只君子，福履绥之。",
          src: "《诗经 · 周南 · 樛木》",
          tags: ["繁茂", "担当"],
        },
        {
          n: "林星汉",
          p: "Lin Xing Han",
          s: "日月之行，若出其中；星汉灿烂，若出其里。",
          src: "曹操《观沧海》",
          tags: ["辽阔", "壮志"],
        },
      ];
      const grid = document.getElementById("grid");
      DATA.forEach((d, i) => {
        const el = document.createElement("div");
        el.className = "card";
        el.style.transitionDelay = i * 0.09 + "s";
        el.innerHTML = `<div class="pick">✓</div><div class="pinyin">${d.p}</div>
    <div class="cname">${d.n}</div><div class="cline">${d.s.split("。")[0]}。</div>`;
        el.addEventListener("click", () => openDetail(d));
        el.querySelector(".pick").addEventListener("click", (e) => {
          e.stopPropagation();
          el.classList.toggle("kept");
          updateCounts();
        });
        grid.appendChild(el);
      });
      function updateCounts() {
        document.getElementById("cnt").textContent = DATA.length;
        document.getElementById("keptCnt").textContent =
          document.querySelectorAll(".card.kept").length;
      }
      function start() {
        document.body.classList.add("started");
        document.getElementById("hero").classList.add("up");
      }
      document.getElementById("go").addEventListener("click", start);
      document.getElementById("q").addEventListener("keydown", (e) => {
        if (e.key === "Enter") start();
      });

      const detail = document.getElementById("detail");
      function openDetail(d) {
        dPinyin.textContent = d.p;
        dName.textContent = d.n;
        dSrc.textContent = `「${d.s}」<br>—— ${d.src}`;
        dTags.innerHTML = d.tags.map((t) => `<span>${t}</span>`).join("");
        detail.classList.add("show");
      }
      detail.addEventListener("click", () => detail.classList.remove("show"));

      document.querySelectorAll(".island button").forEach((b) =>
        b.addEventListener("click", () => {
          document.querySelectorAll(".island button").forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
          const short = b.dataset.stage === "short";
          document.body.classList.toggle("shortlist", short);
          document.getElementById("headTitle").textContent = short
            ? "精选留存 · 决断之名"
            : "初筛候选 · 引经据典";
        }),
      );
    </script>
  </body>
</html>
