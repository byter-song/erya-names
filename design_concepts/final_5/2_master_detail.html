<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尔雅 · 展卷主从</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600&display=swap');
  :root{
    --paper:#FBF9F4;--paper-2:#F3F0E8;--ink:#1B1A17;--ink-2:#5E5B52;--ink-3:#9B978B;
    --gold:#AC8A54;--gold-soft:rgba(172,138,84,.12);--cinnabar:#A84E3C;
    --spring:cubic-bezier(.16,1,.3,1);
    --serif:'Noto Serif SC',serif;--brush:'Ma Shan Zheng',cursive;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{height:100vh;font-family:var(--serif);background:var(--paper);color:var(--ink);overflow:hidden}

  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg::before{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 80% 0,rgba(172,138,84,.12),transparent 55%),
              radial-gradient(ellipse at 0% 100%,rgba(0,0,0,.05),transparent 50%)}
  .inkwash{position:absolute;right:-8vw;bottom:-20vh;width:46vw;height:46vw;border-radius:46% 54% 60% 40%;
    background:radial-gradient(circle at 40% 40%,rgba(30,34,28,.5),transparent 66%);
    filter:blur(60px);opacity:.12;animation:morph 18s ease-in-out infinite alternate}
  @keyframes morph{to{border-radius:60%40%40%60%;transform:translate(-3vw,-2vh)}}

  /* 顶部栏 */
  header{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:30px 48px;border-bottom:1px solid rgba(0,0,0,.06)}
  .logo{font-family:var(--brush);font-size:2rem}
  .steps{display:flex;gap:8px}
  .steps button{border:none;background:none;font-family:var(--serif);font-size:.92rem;color:var(--ink-3);
    padding:8px 18px;border-radius:30px;cursor:pointer;transition:.3s;position:relative}
  .steps button.on{color:var(--ink);background:var(--gold-soft);color:var(--gold)}
  .steps button .n{font-size:.72rem;opacity:.7;margin-right:4px}

  /* 主体：网格 → 点击后分屏 */
  .main{position:relative;z-index:10;height:calc(100vh - 85px);display:flex}
  .list{flex:1;padding:38px 48px;overflow-y:auto;
    transition:flex .85s var(--spring),padding .85s var(--spring)}
  .list::-webkit-scrollbar{width:0}
  body.split .list{flex:0 0 38%;padding:34px 26px;border-right:1px solid rgba(0,0,0,.07);
    background:linear-gradient(to right,var(--paper-2),transparent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
  body.split .grid{grid-template-columns:1fr;gap:12px}

  .card{position:relative;background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:18px;
    padding:26px 22px;cursor:pointer;transition:.4s var(--spring);overflow:hidden}
  .card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(40,34,20,.08);border-color:var(--gold)}
  body.split .card{padding:18px 20px;display:flex;align-items:baseline;gap:14px;border-radius:12px}
  body.split .card .pinyin{display:none}
  .card.act{border-color:var(--gold);background:var(--gold-soft)}
  body.split .card.act{box-shadow:none}
  .pinyin{font-size:.72rem;letter-spacing:.24em;color:var(--gold)}
  .cname{font-family:var(--brush);font-size:2.6rem;line-height:1.15;margin:4px 0}
  body.split .cname{font-size:1.7rem;margin:0}
  .cline{font-size:.85rem;color:var(--ink-2)}
  body.split .cline{margin-left:auto;font-size:.8rem;white-space:nowrap}

  /* 详情面板 */
  .detail{flex:0 0 0;opacity:0;overflow:hidden;position:relative;
    transition:flex .85s var(--spring),opacity .5s .25s;background:var(--paper)}
  body.split .detail{flex:1;opacity:1}
  .detail-pad{position:absolute;inset:0;padding:7vh 6vw;display:flex;flex-direction:column;
    opacity:0;transform:translateX(60px);transition:.7s var(--spring) .2s;overflow-y:auto}
  body.split .detail-pad{opacity:1;transform:none}

  .d-top{display:flex;align-items:center;gap:20px;margin-bottom:10px}
  .d-seal{font-family:var(--brush);color:var(--cinnabar);border:2px solid var(--cinnabar);
    width:50px;height:50px;display:grid;place-items:center;border-radius:8px;font-size:1.3rem;opacity:.85}
  .d-pinyin{letter-spacing:.35em;color:var(--gold);font-size:1rem}
  .d-name{font-family:var(--brush);font-size:clamp(4.5rem,10vw,7.5rem);line-height:1.05;margin:6px 0 20px}
  .d-quote{font-size:1.3rem;line-height:2;color:var(--ink);padding:24px 0;border-top:1px solid rgba(172,138,84,.3);
    border-bottom:1px solid rgba(172,138,84,.3)}
  .d-quote em{display:block;text-align:right;font-style:normal;color:var(--gold);font-size:1rem;margin-top:10px}
  .d-cols{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
  .d-cols h4{font-size:.85rem;letter-spacing:.25em;color:var(--ink-3);font-weight:500;margin-bottom:12px}
  .d-cols p{font-size:.95rem;line-height:1.9;color:var(--ink-2)}
  .d-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:26px}
  .d-tags span{font-size:.8rem;padding:6px 15px;border:1px solid rgba(172,138,84,.5);border-radius:30px;color:var(--gold)}
  .d-hint{position:absolute;bottom:26px;right:36px;color:var(--ink-3);font-size:.8rem;letter-spacing:.25em;
    animation:blink 2.2s infinite}
  @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>
  <div class="bg"><div class="inkwash"></div></div>
  <header>
    <div class="logo">尔雅</div>
    <nav class="steps">
      <button class="on"><span class="n">01</span>初筛</button>
      <button><span class="n">02</span>字理</button>
      <button><span class="n">03</span>定稿</button>
    </nav>
  </header>

  <div class="main">
    <section class="list"><div class="grid" id="grid"></div></section>
    <section class="detail">
      <div class="detail-pad">
        <div class="d-top"><div class="d-seal">尔雅</div><div class="d-pinyin" id="dPinyin"></div></div>
        <div class="d-name" id="dName"></div>
        <div class="d-quote" id="dQuote"></div>
        <div class="d-cols">
          <div><h4>字 理 释 义</h4><p id="dMean"></p></div>
          <div><h4>用 名 提 示</h4><p id="dTip"></p></div>
        </div>
        <div class="d-tags" id="dTags"></div>
      </div>
      <div class="d-hint">继 续 点 击 卡 片 返 回</div>
    </section>
  </div>

<script>
const DATA=[
 {n:"林子衿",p:"LIN ZI JIN",q:"青青子衿，悠悠我心。纵我不往，子宁不嗣音。",s:"《诗经 · 郑风 · 子衿》",
  mean:"子，有德有才之君子；衿，衣领，古学子所服。名字承载对学识与德行的期许。",
  tip:"音韵平上平，抑扬有致；与多数字姓搭配和谐，宜慎用叠音亲属名。",tags:["学识","经典","倾慕"]},
 {n:"林若华",p:"LIN RUO HUA",q:"羲和之未扬，若华何光？何所冬暖，何所夏寒。",s:"《楚辞 · 天问》",
  mean:"若华，神话中若木之花，朝迎日光。喻朝气、光华与生生不息。",
  tip:"若字开口呼，华字平声延展，名尾响亮，适合追求清朗气质。",tags:["光华","朝气","神话"]},
 {n:"林望舒",p:"LIN WANG SHU",q:"前望舒使先驱兮，后飞廉使奔属。",s:"《楚辞 · 离骚》",
  mean:"望舒，为月驾车之神。含迎光而行、温柔而坚定之意。",
  tip:"望舒皆平声，宜配去声姓氏以增起伏；气质清雅偏文。",tags:["月神","清雅","迎光"]},
 {n:"林清婉",p:"LIN QING WAN",q:"有美一人，清扬婉兮。邂逅相遇，适我愿兮。",s:"《诗经 · 郑风》",
  mean:"清为澄澈，婉为柔美。合喻眉目清朗、性情温婉。",
  tip:"清婉平仄相间，柔而不弱；适合女名，书卷气足。",tags:["温婉","柔美"]},
 {n:"林嘉木",p:"LIN JIA MU",q:"南有嘉木，葛藟累之。乐只君子，福履绥之。",s:"《诗经 · 周南》",
  mean:"嘉木，美好之树木，可栖可依。喻良才与担当。",
  tip:"木字收声短促，中性沉稳；男女皆宜，偏君子端方。",tags:["繁茂","担当","中性"]},
 {n:"林星汉",p:"LIN XING HAN",q:"日月之行，若出其中；星汉灿烂，若出其里。",s:"曹操《观沧海》",
  mean:"星汉即银河。喻胸襟辽阔、志向灿然。",
  tip:"星汉二字开阔，男名为佳；声调清亮，收尾有力。",tags:["辽阔","壮志"]}
];
const grid=document.getElementById('grid');
DATA.forEach(d=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div><div class="pinyin">${d.p}</div><div class="cname">${d.n}</div></div>
    <div class="cline">${d.s}</div>`;
  c.addEventListener('click',()=>{
    if(c.classList.contains('act')){close();return;}
    document.querySelectorAll('.card').forEach(x=>x.classList.remove('act'));
    c.classList.add('act');document.body.classList.add('split');
    dPinyin.textContent=d.p;dName.textContent=d.n;
    dQuote.innerHTML=`${d.q}<em>—— ${d.s}</em>`;
    dMean.textContent=d.mean;dTip.textContent=d.tip;
    dTags.innerHTML=d.tags.map(t=>`<span>${t}</span>`).join('');
  });
  grid.appendChild(c);
});
function close(){document.body.classList.remove('split');
  document.querySelectorAll('.card').forEach(x=>x.classList.remove('act'));}
</script>
</body>
</html>
