<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>尔雅 | 景深聚焦 (Z-Axis Focus)</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400&display=swap");
      body {
        margin: 0;
        background: #fafaf7;
        font-family: "Noto Serif SC", serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1500px;
      }
      .grid {
        display: flex;
        gap: 40px;
        transform-style: preserve-3d;
        transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .card {
        width: 250px;
        height: 350px;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform-origin: center;
      }
      .brush {
        font-family: "Ma Shan Zheng", cursive;
        font-size: 4rem;
        color: #111;
      }

      /* 景深效果 */
      body.focused .card {
        transform: translateZ(-300px) scale(0.8);
        filter: blur(5px);
        opacity: 0.4;
      }
      body.focused .card.active {
        transform: translateZ(100px) scale(1.2);
        filter: blur(0);
        opacity: 1;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
      }

      .detail {
        opacity: 0;
        max-height: 0;
        overflow: hidden;
        transition: all 0.4s;
        font-size: 0.9rem;
        color: #666;
        margin-top: 20px;
        text-align: center;
        padding: 0 20px;
      }
      .card.active .detail {
        opacity: 1;
        max-height: 100px;
      }
      .overlay-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(250, 250, 247, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: 0.8s;
        z-index: -1;
      }
      body.focused .overlay-bg {
        opacity: 1;
        z-index: 10;
      }
      body.focused .grid {
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div class="overlay-bg" onclick="clearFocus()"></div>
    <div class="grid" id="grid">
      <div class="card" onclick="focusCard(this)">
        <div class="brush">林子衿</div>
        <div class="detail">青青子衿，悠悠我心。</div>
      </div>
      <div class="card" onclick="focusCard(this)">
        <div class="brush">林若华</div>
        <div class="detail">羲和之未扬，若华何光。</div>
      </div>
      <div class="card" onclick="focusCard(this)">
        <div class="brush">林望舒</div>
        <div class="detail">前望舒使先驱兮。</div>
      </div>
    </div>

    <script>
      function focusCard(el) {
        document.querySelectorAll(".card").forEach((c) => c.classList.remove("active"));
        el.classList.add("active");
        document.body.classList.add("focused");
      }
      function clearFocus() {
        document.querySelectorAll(".card").forEach((c) => c.classList.remove("active"));
        document.body.classList.remove("focused");
      }
    </script>
  </body>
</html>
