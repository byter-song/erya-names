<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>尔雅 | 阶段磁吸 (Stage Magnetic)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400&display=swap');
        body { margin: 0; background: #FAFAF7; font-family: 'Noto Serif SC', serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 阶段导航 */
        .stage-nav { display: flex; justify-content: center; padding: 30px 0; gap: 40px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .stage-btn { font-size: 1.1rem; color: #999; cursor: pointer; transition: color 0.3s; position: relative; }
        .stage-btn.active { color: #111; font-weight: bold; }
        .stage-btn.active::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 20px; height: 2px; background: #B38B59; }

        .workspace { flex: 1; display: flex; position: relative; }
        
        .pool { width: 100%; padding: 40px; display: flex; flex-wrap: wrap; gap: 20px; align-content: flex-start; transition: 0.5s; }
        .basket { width: 0; background: #F5F4F0; border-left: 1px dashed #ccc; padding: 40px 0; transition: 0.5s; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        /* 切换到筛选态 */
        body.filtering .pool { width: 60%; }
        body.filtering .basket { width: 40%; padding: 40px; }

        .card { background: #fff; padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); cursor: pointer; transition: all 0.3s; border: 1px solid transparent; }
        .card:hover { transform: translateY(-5px); border-color: #B38B59; }
        .card.selected { background: #B38B59; color: #fff; }
        .brush { font-family: 'Ma Shan Zheng', cursive; font-size: 2rem; }
    </style>
</head>
<body>
    <div class="stage-nav">
        <div class="stage-btn active" onclick="setStage('gen')">1. 灵感涌现</div>
        <div class="stage-btn" onclick="setStage('filter')">2. 留存比对</div>
    </div>

    <div class="workspace">
        <div class="pool" id="pool">
            <div class="card" onclick="toggleSelect(this)"><div class="brush">林子衿</div></div>
            <div class="card" onclick="toggleSelect(this)"><div class="brush">林若华</div></div>
            <div class="card" onclick="toggleSelect(this)"><div class="brush">林望舒</div></div>
        </div>
        <div class="basket" id="basket">
            <h3 style="color:#B38B59; margin-top:0; white-space: nowrap;">已留存</h3>
            <!-- Selected cards move here -->
        </div>
    </div>

    <script>
        function toggleSelect(el) {
            el.classList.toggle('selected');
            if(el.classList.contains('selected')) {
                document.getElementById('basket').appendChild(el);
            } else {
                document.getElementById('pool').appendChild(el);
            }
        }
        function setStage(stage) {
            document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if(stage === 'filter') document.body.classList.add('filtering');
            else document.body.classList.remove('filtering');
        }
    </script>
</body>
</html>
