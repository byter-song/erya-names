<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>尔雅 | 流体展开 (Fluid Expansion)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500&display=swap');
        :root { --bg: #FAFAF7; --ink: #1C1C1C; --accent: #B38B59; --spring: cubic-bezier(0.175, 0.885, 0.32, 1.1); }
        body { margin: 0; font-family: 'Noto Serif SC', serif; background: var(--bg); color: var(--ink); height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .ambient { position: absolute; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(0,0,0,0.03) 0%, transparent 60%); border-radius: 50%; filter: blur(40px); animation: breathe 10s infinite alternate; }
        @keyframes breathe { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.2); opacity: 1; } }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; z-index: 10; padding: 50px; width: 100%; max-width: 1000px; }
        .card { background: rgba(255,255,255,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.8); border-radius: 20px; padding: 40px 30px; text-align: center; cursor: pointer; transition: all 0.4s var(--spring); }
        .card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .card .brush { font-family: 'Ma Shan Zheng', cursive; font-size: 3.5rem; margin: 10px 0; }
        
        /* Expansion Modal */
        .detail-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(250, 250, 247, 0.95); backdrop-filter: blur(30px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        .detail-overlay.active { opacity: 1; pointer-events: auto; }
        .detail-content { transform: scale(0.8) translateY(50px); transition: all 0.6s var(--spring); text-align: center; }
        .detail-overlay.active .detail-content { transform: scale(1) translateY(0); }
        
        .detail-brush { font-family: 'Ma Shan Zheng', cursive; font-size: 8rem; color: var(--ink); margin: 0; }
        .close-btn { position: absolute; top: 40px; right: 40px; font-size: 2rem; cursor: pointer; color: var(--ink); }
    </style>
</head>
<body>
    <div class="ambient"></div>
    <div class="grid">
        <div class="card" onclick="openDetail('林子衿', 'Lín Zǐ Jīn', '青青子衿，悠悠我心。')">
            <div style="color:var(--accent); letter-spacing:2px;">Lín Zǐ Jīn</div>
            <div class="brush">林子衿</div>
        </div>
        <div class="card" onclick="openDetail('林若华', 'Lín Ruò Huá', '羲和之未扬，若华何光。')">
            <div style="color:var(--accent); letter-spacing:2px;">Lín Ruò Huá</div>
            <div class="brush">林若华</div>
        </div>
        <div class="card" onclick="openDetail('林望舒', 'Lín Wàng Shū', '前望舒使先驱兮。')">
            <div style="color:var(--accent); letter-spacing:2px;">Lín Wàng Shū</div>
            <div class="brush">林望舒</div>
        </div>
    </div>

    <div class="detail-overlay" id="overlay">
        <div class="close-btn" onclick="closeDetail()">×</div>
        <div class="detail-content">
            <div id="dPinyin" style="color:var(--accent); font-size:1.5rem; letter-spacing:5px;"></div>
            <h1 class="detail-brush" id="dName"></h1>
            <p id="dDesc" style="font-size: 1.5rem; color: #555; margin-top: 40px;"></p>
        </div>
    </div>

    <script>
        function openDetail(name, pinyin, desc) {
            document.getElementById('dName').innerText = name;
            document.getElementById('dPinyin').innerText = pinyin;
            document.getElementById('dDesc').innerText = desc;
            document.getElementById('overlay').classList.add('active');
        }
        function closeDetail() { document.getElementById('overlay').classList.remove('active'); }
    </script>
</body>
</html>
