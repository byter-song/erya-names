<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>尔雅 | 赛博国风 (Cyber Antiquity)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Noto+Sans+SC:wght@300;700&display=swap');
        
        body {
            margin: 0;
            height: 100vh;
            background-color: #09090b;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 赛博朋克霓虹光晕 背景 */
        .neon-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.6;
            animation: floatBlob 8s infinite alternate ease-in-out;
        }

        .neon-blob.blue {
            width: 400px; height: 400px;
            background: #00f0ff;
            top: 10%; left: 20%;
        }

        .neon-blob.pink {
            width: 500px; height: 500px;
            background: #ff003c;
            bottom: 10%; right: 15%;
            animation-delay: -4s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -50px) scale(1.1); }
        }

        /* 毛玻璃面板 */
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 60px 100px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Zhi Mang Xing', cursive;
            font-size: 7rem;
            margin: 0 0 20px 0;
            /* 赛博国风核心：空心发光书法字 */
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.5), 0 0 10px rgba(255, 0, 60, 0.3);
            position: relative;
        }

        /* 扫描线效果 */
        h1::after {
            content: "尔雅";
            position: absolute;
            top: 0; left: 0;
            color: #fff;
            -webkit-text-stroke: 0px;
            overflow: hidden;
            height: 0%;
            animation: scan 4s infinite linear;
            text-shadow: 0 0 20px #00f0ff;
        }

        @keyframes scan {
            0% { height: 0%; }
            50% { height: 100%; }
            100% { height: 0%; }
        }

        .cyber-input {
            margin-top: 30px;
            position: relative;
            display: inline-block;
        }

        input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0, 240, 255, 0.5);
            color: #00f0ff;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 4px;
            outline: none;
            width: 250px;
            text-align: center;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        input:focus {
            border-color: #ff003c;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.4), inset 0 0 10px rgba(255, 0, 60, 0.2);
            color: #ff003c;
        }
        
        input::placeholder { color: rgba(255,255,255,0.3); }

    </style>
</head>
<body>
    <div class="neon-blob blue"></div>
    <div class="neon-blob pink"></div>

    <div class="glass-card">
        <h1>尔雅</h1>
        <div class="cyber-input">
            <input type="text" placeholder="输入参数 // INIT_NAME">
        </div>
    </div>
</body>
</html>
