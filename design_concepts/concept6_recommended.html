<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>尔雅 | 金线墨迹 (推荐实战版)</title>
    <style>
      /* 强制系统字体栈，不加载任何 Web Font，保障 local-first 与极速渲染 */
      :root {
        --ink-main: #1a1a1a;
        --ink-light: #555555;
        --gold-line: #d4af37;
        --bg-paper: #fcfbf9;
        --bg-sidebar: #f5f4f0;
        --sys-font:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        --sys-font-serif: "Songti SC", "STSong", "SimSun", serif;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--sys-font);
        background-color: var(--bg-paper);
        color: var(--ink-main);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* 固定文本式侧栏 */
      .sidebar {
        width: 320px;
        background-color: var(--bg-sidebar);
        border-right: 1px solid rgba(212, 175, 55, 0.3); /* 金线分割 */
        display: flex;
        flex-direction: column;
        padding: 40px 30px;
        box-sizing: border-box;
        flex-shrink: 0;
      }

      .logo {
        font-family: var(--sys-font-serif);
        font-size: 2.5rem;
        font-weight: normal;
        letter-spacing: 0.5rem;
        margin: 0 0 10px 0;
        color: var(--ink-main);
      }

      .logo-desc {
        font-size: 0.85rem;
        color: var(--ink-light);
        margin-bottom: 50px;
        letter-spacing: 1px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 40px;
      }

      input {
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--ink-light);
        padding: 10px 0;
        font-size: 1rem;
        color: var(--ink-main);
        font-family: inherit;
        outline: none;
        transition: border-color 0.3s;
      }

      input:focus {
        border-bottom-color: var(--gold-line);
      }

      button {
        background: transparent;
        border: 1px solid var(--gold-line);
        color: var(--gold-line);
        padding: 12px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        font-family: inherit;
        letter-spacing: 2px;
      }

      button:hover {
        background: var(--gold-line);
        color: #fff;
      }

      /* 阶段式流程指示 */
      .stage-list {
        list-style: none;
        padding: 0;
        margin: 0;
        flex-grow: 1;
      }

      .stage-item {
        font-size: 0.9rem;
        color: var(--ink-light);
        padding: 15px 0;
        border-left: 2px solid transparent;
        padding-left: 15px;
        margin-bottom: 10px;
        cursor: pointer;
      }

      .stage-item.active {
        color: var(--ink-main);
        border-left-color: var(--gold-line);
        font-weight: 500;
      }

      /* 主内容区：批量生成 + 初筛 */
      .main-content {
        flex-grow: 1;
        padding: 60px;
        overflow-y: auto;
      }

      .section-title {
        font-family: var(--sys-font-serif);
        font-size: 1.5rem;
        font-weight: normal;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .section-title::after {
        content: "";
        height: 1px;
        flex-grow: 1;
        background: linear-gradient(to right, rgba(212, 175, 55, 0.3), transparent);
      }

      .name-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
      }

      .name-card {
        border: 1px solid rgba(0, 0, 0, 0.05);
        padding: 25px;
        background: #fff;
        transition: all 0.3s;
        cursor: pointer;
        position: relative;
      }

      .name-card:hover {
        border-color: var(--gold-line);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        transform: translateY(-2px);
      }

      .name-chars {
        font-family: var(--sys-font-serif);
        font-size: 2.2rem;
        margin: 0 0 15px 0;
        color: var(--ink-main);
      }

      .name-pinyin {
        font-size: 0.8rem;
        color: var(--gold-line);
        margin-bottom: 15px;
        letter-spacing: 1px;
        font-family: monospace;
      }

      .name-meaning {
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--ink-light);
        margin-bottom: 15px;
      }

      .historical-ref {
        font-size: 0.8rem;
        padding-top: 15px;
        border-top: 1px dashed rgba(0, 0, 0, 0.1);
        color: #888;
        line-height: 1.5;
      }

      /* 选中状态 */
      .checkbox {
        position: absolute;
        top: 25px;
        right: 25px;
        width: 18px;
        height: 18px;
        border: 1px solid var(--ink-light);
        border-radius: 50%;
      }

      .name-card.selected .checkbox {
        border-color: var(--gold-line);
        background: var(--gold-line);
      }
      .name-card.selected .checkbox::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 10px;
        height: 10px;
        background: #fff;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <h1 class="logo">尔雅</h1>
      <div class="logo-desc">辞以达意，名以正言</div>

      <div class="input-group">
        <input type="text" placeholder="输入姓氏 (如: 林)" />
        <input type="text" placeholder="输入期许 (如: 温文尔雅, 见贤思齐)" />
        <button>引经据典</button>
      </div>

      <ul class="stage-list">
        <li class="stage-item active">1. 批量生成与初筛</li>
        <li class="stage-item">2. 深度字理释义</li>
        <li class="stage-item">3. 导出命名册</li>
      </ul>
    </aside>

    <main class="main-content">
      <h2 class="section-title">初筛候选 (基于《诗经》与《楚辞》)</h2>

      <div class="name-grid">
        <!-- 卡片 1 -->
        <div class="name-card selected" onclick="this.classList.toggle('selected')">
          <div class="checkbox"></div>
          <div class="name-pinyin">Lín Zǐ Jīn</div>
          <h3 class="name-chars">林子衿</h3>
          <div class="name-meaning">青青子衿，悠悠我心。形容人才华横溢，令人倾慕。</div>
          <div class="historical-ref">Reference: 《诗经·郑风·子衿》</div>
        </div>

        <!-- 卡片 2 -->
        <div class="name-card" onclick="this.classList.toggle('selected')">
          <div class="checkbox"></div>
          <div class="name-pinyin">Lín Ruò Huá</div>
          <h3 class="name-chars">林若华</h3>
          <div class="name-meaning">
            羲和之未扬，若华何光。指古代神话中若木的花，象征光华与朝气。
          </div>
          <div class="historical-ref">Reference: 《楚辞·天问》</div>
        </div>

        <!-- 卡片 3 -->
        <div class="name-card" onclick="this.classList.toggle('selected')">
          <div class="checkbox"></div>
          <div class="name-pinyin">Lín Yù Lì</div>
          <h3 class="name-chars">林玉立</h3>
          <div class="name-meaning">亭亭玉立，如松之盛。形容品格高洁，卓尔不群。</div>
          <div class="historical-ref">Reference: 《世说新语·容止》 (仅作历史用词参考)</div>
        </div>
      </div>
    </main>
  </body>
</html>
