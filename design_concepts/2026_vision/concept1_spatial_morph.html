<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>尔雅 2026 | 空间水墨 (Spatial Ink & Morph)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap');
        
        :root {
            --bg: #FAFAF7;
            --ink: #1C1C1C;
            --ink-light: #5A5A5A;
            --accent: #B38B59;
            --glass: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        body {
            margin: 0; padding: 0; font-family: 'Noto Serif SC', serif;
            background-color: var(--bg); color: var(--ink);
            height: 100vh; overflow: hidden; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            position: relative; perspective: 1000px;
        }

        /* 2026 Trend: Abstract Fluid Background */
        .ambient-ink {
            position: absolute; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(0,0,0,0.03) 0%, transparent 60%);
            border-radius: 50%; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(40px); pointer-events: none;
            animation: breathe 10s infinite alternate ease-in-out;
            z-index: 0;
        }

        @keyframes breathe {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* 2026 Trend: Generative UI Morphing */
        .hero-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; max-width: 600px; text-align: center;
            z-index: 10; transition: all 1s var(--spring);
        }

        .hero-container.active {
            top: 50px; transform: translate(-50%, 0) scale(0.7);
        }

        .logo { font-size: 3rem; font-weight: 300; letter-spacing: 0.5em; margin-bottom: 30px; }

        .ai-input {
            width: 100%; padding: 20px 30px; border-radius: 40px;
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); box-shadow: var(--shadow);
            font-size: 1.2rem; font-family: inherit; color: var(--ink);
            outline: none; transition: all 0.3s; text-align: center;
        }

        .ai-input:focus {
            box-shadow: 0 20px 50px rgba(0,0,0,0.08); border-color: var(--accent);
        }

        /* 2026 Trend: Spatial Grid (Z-axis depth) */
        .results-grid {
            position: absolute; top: 150px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1200px; height: calc(100vh - 200px);
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px; padding: 20px; overflow-y: auto; z-index: 5;
            opacity: 0; pointer-events: none;
        }

        /* Hide scrollbar */
        .results-grid::-webkit-scrollbar { display: none; }

        .results-grid.active {
            opacity: 1; pointer-events: auto;
        }

        .card {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 40px 30px; text-align: center; box-shadow: var(--shadow);
            transform: translateZ(-100px) translateY(50px); opacity: 0;
            transition: all 0.8s var(--spring); cursor: pointer;
            position: relative; overflow: hidden;
        }

        .results-grid.active .card {
            transform: translateZ(0) translateY(0); opacity: 1;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02) !important;
            border-color: var(--accent);
        }

        /* Card internals */
        .name { font-size: 2.5rem; font-weight: 500; margin: 10px 0; }
        .pinyin { font-size: 0.9rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        .desc { font-size: 0.95rem; color: var(--ink-light); margin-top: 20px; line-height: 1.6; }

    </style>
</head>
<body>
    <div class="ambient-ink"></div>

    <div class="hero-container" id="hero">
        <div class="logo">尔雅</div>
        <input type="text" class="ai-input" placeholder="输入期许，唤醒名字..." id="inputBox">
    </div>

    <div class="results-grid" id="grid">
        <!-- Cards generated by JS for staggered animation -->
    </div>

    <script>
        const input = document.getElementById('inputBox');
        const hero = document.getElementById('hero');
        const grid = document.getElementById('grid');

        const names = [
            { n: '林子衿', p: 'Lín Zǐ Jīn', d: '青青子衿，悠悠我心。' },
            { n: '林若华', p: 'Lín Ruò Huá', d: '羲和之未扬，若华何光。' },
            { n: '林望舒', p: 'Lín Wàng Shū', d: '前望舒使先驱兮。' },
            { n: '林清婉', p: 'Lín Qīng Wǎn', d: '清扬婉兮，温婉如水。' },
            { n: '林嘉木', p: 'Lín Jiā Mù', d: '南有嘉木，繁润成荫。' },
            { n: '林星汉', p: 'Lín Xīng Hàn', d: '星汉灿烂，若出其里。' }
        ];

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                hero.classList.add('active');
                grid.innerHTML = '';
                
                names.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.transitionDelay = `${index * 0.1}s`;
                    card.innerHTML = `
                        <div class="pinyin">${item.p}</div>
                        <div class="name">${item.n}</div>
                        <div class="desc">${item.d}</div>
                    `;
                    grid.appendChild(card);
                });

                setTimeout(() => {
                    grid.classList.add('active');
                }, 100);
            }
        });
    </script>
</body>
</html>
