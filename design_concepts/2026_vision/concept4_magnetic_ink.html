<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>尔雅 2026 | 磁性墨迹 (Magnetic Physics)</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap");

      body {
        margin: 0;
        padding: 0;
        font-family: "Noto Serif SC", serif;
        background-color: #fdfcf9;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 2026 Trend: Physics-based UI */
      .magnetic-area {
        position: relative;
        width: 80vw;
        height: 80vh;
      }

      .name-orb {
        position: absolute;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1);
      }

      .name-orb:hover {
        background: #111;
        color: #fff;
        transform: scale(1.1) !important;
        z-index: 100;
      }

      .name {
        font-size: 2rem;
        margin-bottom: 5px;
      }
      .pinyin {
        font-size: 0.8rem;
        opacity: 0.6;
        font-family: sans-serif;
        letter-spacing: 1px;
      }

      /* Initial absolute positions */
      #n1 {
        top: 20%;
        left: 20%;
        width: 200px;
        height: 200px;
      }
      #n2 {
        top: 50%;
        left: 40%;
        width: 250px;
        height: 250px;
      }
      #n3 {
        top: 30%;
        left: 70%;
        width: 180px;
        height: 180px;
      }
      #n4 {
        top: 70%;
        left: 75%;
        width: 150px;
        height: 150px;
      }
      #n5 {
        top: 60%;
        left: 15%;
        width: 160px;
        height: 160px;
      }
    </style>
  </head>
  <body>
    <h1 style="position: absolute; top: 40px; left: 60px; font-weight: 300">尔雅</h1>

    <div class="magnetic-area">
      <div class="name-orb" id="n1">
        <div class="name">林子衿</div>
        <div class="pinyin">Lín Zǐ Jīn</div>
      </div>
      <div class="name-orb" id="n2">
        <div class="name">林若华</div>
        <div class="pinyin">Lín Ruò Huá</div>
      </div>
      <div class="name-orb" id="n3">
        <div class="name">林望舒</div>
        <div class="pinyin">Lín Wàng Shū</div>
      </div>
      <div class="name-orb" id="n4">
        <div class="name">林清婉</div>
        <div class="pinyin">Lín Qīng Wǎn</div>
      </div>
      <div class="name-orb" id="n5">
        <div class="name">林星汉</div>
        <div class="pinyin">Lín Xīng Hàn</div>
      </div>
    </div>

    <script>
      // Simple Magnetic effect simulation
      const orbs = document.querySelectorAll(".name-orb");

      window.addEventListener("mousemove", (e) => {
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        orbs.forEach((orb) => {
          const rect = orb.getBoundingClientRect();
          const orbX = rect.left + rect.width / 2;
          const orbY = rect.top + rect.height / 2;

          const distX = mouseX - orbX;
          const distY = mouseY - orbY;
          const distance = Math.sqrt(distX * distX + distY * distY);

          // If mouse is within 200px, pull the orb slightly
          if (distance < 300) {
            const pull = (300 - distance) / 10;
            const moveX = (distX / distance) * pull;
            const moveY = (distY / distance) * pull;
            orb.style.transform = `translate(${moveX}px, ${moveY}px)`;
          } else {
            orb.style.transform = `translate(0px, 0px)`;
          }
        });
      });
    </script>
  </body>
</html>
