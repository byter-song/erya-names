<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>尔雅 2026 | 流体活字 (Organic Bento)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap');
        
        :root {
            --bg: #F5F4F0;
            --ink: #222;
        }

        body {
            margin: 0; padding: 40px; font-family: 'Noto Serif SC', serif;
            background-color: var(--bg); color: var(--ink);
            min-height: 100vh; box-sizing: border-box;
            display: flex; flex-direction: column;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 60px;
        }

        .logo { font-size: 2rem; letter-spacing: 0.2em; }
        
        .ai-prompt {
            border: none; background: transparent; font-size: 1.5rem;
            font-family: inherit; color: var(--ink); border-bottom: 1px solid rgba(0,0,0,0.2);
            padding: 10px 0; width: 400px; outline: none; text-align: right;
        }

        /* 2026 Trend: Organic Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 250px;
            gap: 20px;
            flex-grow: 1;
        }

        .bento-item {
            background: #fff; padding: 40px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; cursor: pointer; position: relative; overflow: hidden;
            /* The core of organic bento: fluid border radius */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            transition: all 0.5s ease;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03), 0 10px 30px rgba(0,0,0,0.02);
            animation: morph 8s ease-in-out infinite alternate;
        }

        .bento-item:hover {
            background: #FAFAFA; transform: scale(1.05);
            border-radius: 20px; /* Snaps to modern crisp rectangle on hover */
            z-index: 10;
        }

        /* Specific grid placements for variety */
        .item-large { grid-column: span 2; grid-row: span 2; border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; animation-delay: -2s; }
        .item-wide { grid-column: span 2; border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; animation-delay: -4s; }
        .item-tall { grid-row: span 2; border-radius: 50% 50% 20% 80% / 25% 80% 20% 75%; animation-delay: -1s; }

        @keyframes morph {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        }

        .name { font-size: 2.2rem; margin-bottom: 10px; }
        .item-large .name { font-size: 4rem; }
        .desc { font-size: 0.9rem; color: #666; max-width: 80%; line-height: 1.6; }
        
        /* Subtle ink blob inside */
        .bento-item::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.02) 0%, transparent 70%);
            top: 0; left: 0; pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
        .bento-item:hover::before { opacity: 1; }

    </style>
</head>
<body>
    <div class="header">
        <div class="logo">尔雅</div>
        <input type="text" class="ai-prompt" placeholder="探索名字的边界..." value="温润如玉，气宇轩昂">
    </div>

    <div class="bento-grid">
        <div class="bento-item item-large">
            <div class="name">林玉立</div>
            <div class="desc">亭亭玉立，如松之盛。最具代表性的温润之名。</div>
        </div>
        <div class="bento-item">
            <div class="name">林子衿</div>
            <div class="desc">青青子衿，悠悠我心。</div>
        </div>
        <div class="bento-item item-tall">
            <div class="name">林清婉</div>
            <div class="desc">清扬婉兮，温婉如水。</div>
        </div>
        <div class="bento-item item-wide">
            <div class="name">林若华</div>
            <div class="desc">羲和之未扬，若华何光。</div>
        </div>
        <div class="bento-item">
            <div class="name">林望舒</div>
            <div class="desc">前望舒使先驱兮。</div>
        </div>
    </div>
</body>
</html>
