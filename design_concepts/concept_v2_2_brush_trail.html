<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>尔雅 | 笔锋游走 (Brush Trail)</title>
    <style>
        :root {
            --sys-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --sys-font-serif: "Songti SC", "STSong", "SimSun", serif;
            --paper: #F2F0E9;
        }
        body { margin: 0; background: var(--paper); font-family: var(--sys-font); overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none; }
        .ui-layer { position: relative; z-index: 10; display: flex; height: 100vh; pointer-events: none; }
        .sidebar { width: 320px; padding: 40px; pointer-events: auto; }
        .main { flex: 1; padding: 60px; pointer-events: auto; display: flex; gap: 20px; flex-wrap: wrap; align-content: flex-start; }
        h1 { font-family: var(--sys-font-serif); font-size: 3rem; color: #1a1a1a; margin: 0 0 20px; }
        
        .name-tag {
            padding: 15px 30px; background: rgba(255,255,255,0.6); backdrop-filter: blur(5px);
            border: 1px solid rgba(0,0,0,0.1); border-radius: 40px; font-size: 1.2rem;
            cursor: pointer; transition: all 0.3s;
        }
        .name-tag:hover { background: #fff; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <canvas id="inkCanvas"></canvas>
    <div class="ui-layer">
        <div class="sidebar">
            <h1>尔雅</h1>
            <p style="color:#555; line-height: 1.6;">鼠标滑动留下水墨笔锋，页面元素如水上浮萍。</p>
        </div>
        <div class="main">
            <div class="name-tag">林子衿</div>
            <div class="name-tag">林若华</div>
            <div class="name-tag">林望舒</div>
            <div class="name-tag">林清婉</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('inkCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        let points = [];
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
        
        window.addEventListener('mousemove', (e) => {
            points.push({x: e.clientX, y: e.clientY, age: 0});
        });

        function draw() {
            ctx.fillStyle = 'rgba(242, 240, 233, 0.1)'; // 逐渐褪去
            ctx.fillRect(0, 0, width, height);
            
            if(points.length > 1) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for(let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                    ctx.lineWidth = Math.max(1, 10 - points[i].age * 0.5);
                    ctx.strokeStyle = `rgba(0, 0, 0, ${1 - points[i].age/20})`;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(points[i].x, points[i].y);
                    points[i].age++;
                }
            }
            points = points.filter(p => p.age < 20);
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
