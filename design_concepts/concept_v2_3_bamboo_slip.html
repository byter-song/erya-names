<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>尔雅 | 竹简舒卷 (Bamboo Slips)</title>
    <style>
      :root {
        --sys-font:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        --sys-font-serif: "Songti SC", "STSong", "SimSun", serif;
        --paper: #f8f6f0;
        --ink: #2b2b2b;
      }
      body {
        margin: 0;
        background: var(--paper);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: var(--sys-font);
      }

      .slip-container {
        display: flex;
        gap: 2px;
        height: 70vh;
        max-width: 90vw;
      }

      .slip {
        width: 60px;
        background: #eae5d9;
        border-left: 1px solid rgba(0, 0, 0, 0.05);
        border-right: 1px solid rgba(0, 0, 0, 0.05);
        transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        overflow: hidden;
        display: flex;
        justify-content: center;
        cursor: pointer;
        position: relative;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
      }

      .slip:hover,
      .slip.active {
        width: 300px;
        background: #fff;
      }

      .slip-title {
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-family: var(--sys-font-serif);
        font-size: 1.5rem;
        color: var(--ink);
        margin-top: 30px;
        letter-spacing: 5px;
        white-space: nowrap;
        transition: opacity 0.3s;
      }

      .slip-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
        height: 100%;
        padding: 40px;
        box-sizing: border-box;
        opacity: 0;
        transition: opacity 0.4s 0.2s;
        pointer-events: none;
      }

      .slip:hover .slip-title,
      .slip.active .slip-title {
        opacity: 0;
      }
      .slip:hover .slip-content,
      .slip.active .slip-content {
        opacity: 1;
        pointer-events: auto;
      }

      .content-name {
        font-family: var(--sys-font-serif);
        font-size: 2.5rem;
        margin-bottom: 20px;
        color: var(--ink);
        border-bottom: 1px solid #d4af37;
        padding-bottom: 10px;
        display: inline-block;
      }
      .content-desc {
        color: #666;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="slip-container">
      <!-- 第一个作为侧栏概念 -->
      <div
        class="slip active"
        style="
          width: 250px;
          background: transparent;
          box-shadow: none;
          border: none;
          align-items: flex-start;
          padding: 40px;
        "
      >
        <div style="width: 100%">
          <h1 style="font-family: var(--sys-font-serif); margin: 0 0 20px">尔雅</h1>
          <p style="color: #666">如竹简般展开，交互充满张力。</p>
        </div>
      </div>

      <div class="slip">
        <div class="slip-title">林子衿</div>
        <div class="slip-content">
          <div class="content-name">林子衿</div>
          <div class="content-desc">
            青青子衿，悠悠我心。<br /><br />出自《诗经·郑风》，寓意对人才的渴望与学识的倾慕。
          </div>
        </div>
      </div>
      <div class="slip">
        <div class="slip-title">林若华</div>
        <div class="slip-content">
          <div class="content-name">林若华</div>
          <div class="content-desc">
            羲和之未扬，若华何光。<br /><br />出自《楚辞·天问》，象征光华、朝气与无限的生机。
          </div>
        </div>
      </div>
      <div class="slip">
        <div class="slip-title">林玉立</div>
        <div class="slip-content">
          <div class="content-name">林玉立</div>
          <div class="content-desc">
            亭亭玉立，如松之盛。<br /><br />寓意品格高洁，卓尔不群，如玉般温润挺拔。
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
