<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长卷 · 环列三D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600&display=swap');
:root{
  --paper:#FAF8F2;--ink:#1A1916;--ink2:#5D5A51;--ink3:#A39E90;
  --gold:#AE8B54;--cinnabar:#A84D3B;
  --spring:cubic-bezier(.16,1,.3,1);
  --serif:'Noto Serif SC',serif;--brush:'Ma Shan Zheng',cursive;
}
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;font-family:var(--serif);background:var(--paper);color:var(--ink);overflow:hidden;
  perspective:1500px;touch-action:none}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse at 50% -12%,rgba(174,139,84,.15),transparent 55%),
  radial-gradient(ellipse at 50% 120%,rgba(40,44,36,.1),transparent 55%)}

header{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:30px 56px}
.logo{font-family:var(--brush);font-size:2.1rem}
.hud{font-size:.85rem;color:var(--ink2);letter-spacing:.15em}
.hud b{color:var(--gold);font-size:1.1rem}

.stage{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center}
.track{position:relative;width:0;height:0;transform-style:preserve-3d}
.panel{position:absolute;top:0;left:0;width:var(--cardw);height:62vh;
  margin-left:calc(var(--cardw)/-2);margin-top:calc(62vh/-2);
  background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.9);border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:30px;cursor:pointer;transform-style:preserve-3d;
  box-shadow:0 30px 60px rgba(40,34,20,.12)}
.panel::before{content:"";position:absolute;top:10%;bottom:10%;left:8%;width:1px;
  background:linear-gradient(var(--gold),transparent);opacity:.5}
.p-idx{font-size:.78rem;letter-spacing:.4em;color:var(--ink3);margin-bottom:10px}
.p-py{letter-spacing:.3em;color:var(--gold);font-size:.92rem;margin-bottom:2px}
.p-name{font-family:var(--brush);font-size:clamp(3rem,7vw,5.2rem);line-height:1.05;transition:color .3s}
.p-q{margin-top:18px;font-size:1rem;color:var(--ink2);line-height:1.7}
.p-src{margin-top:6px;font-size:.82rem;color:var(--gold)}

.progress{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);z-index:30;display:flex;gap:7px}
.progress i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.18);transition:.3s}
.progress i.on{background:var(--gold);width:24px;border-radius:6px}
.tip{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:30;color:var(--ink3);
  font-size:.78rem;letter-spacing:.3em}

.detail{position:fixed;inset:0;z-index:60;background:rgba(250,248,243,.88);backdrop-filter:blur(30px);
  opacity:0;pointer-events:none;cursor:pointer;transition:opacity .5s}
.detail.show{opacity:1;pointer-events:auto}
.di{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7vh 6vw;
  transform:translateY(38px);transition:.7s var(--spring)}
.detail.show .di{transform:none}
.d-seal{font-family:var(--brush);color:var(--cinnabar);border:2px solid var(--cinnabar);width:54px;height:54px;display:grid;place-items:center;
  border-radius:8px;font-size:1.3rem;opacity:.85;margin-bottom:20px}
.d-py{letter-spacing:.4em;color:var(--gold);margin-bottom:6px}
.d-name{font-family:var(--brush);font-size:clamp(5rem,14vw,9rem);line-height:1.1}
.d-src{margin-top:24px;color:var(--ink2);font-size:1.2rem;line-height:2;max-width:640px}
.d-back{position:absolute;bottom:5vh;color:var(--ink3);font-size:.82rem;letter-spacing:.3em;animation:blink 2.2s infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <div class="logo">尔雅</div>
  <div class="hud">第 <b id="hIdx">1</b> 帧 · 共 <b id="hTot">0</b> 帧</div>
</header>
<div class="tip">拖 拽 / 滚 轮 / ← → 翻 帧</div>
<main class="stage"><div class="track" id="track"></div></main>
<div class="progress" id="progress"></div>

<div class="detail" id="detail"><div class="di">
  <div class="d-seal">尔雅</div>
  <div class="d-py" id="dPy"></div>
  <div class="d-name" id="dName"></div>
  <div class="d-src" id="dSrc"></div>
  <div class="d-back">继 续 点 击 任 意 处 返 回</div>
</div></div>

<script>
const NAMES=[
 {n:"林子衿",p:"LIN ZI JIN",q:"青青子衿，悠悠我心。",s:"《诗经 · 郑风》"},
 {n:"林若华",p:"LIN RUO HUA",q:"羲和之未扬，若华何光？",s:"《楚辞 · 天问》"},
 {n:"林望舒",p:"LIN WANG SHU",q:"前望舒使先驱兮。",s:"《楚辞 · 离骚》"},
 {n:"林清婉",p:"LIN QING WAN",q:"有美一人，清扬婉兮。",s:"《诗经 · 郑风》"},
 {n:"林嘉木",p:"LIN JIA MU",q:"南有嘉木，葛藟累之。",s:"《诗经 · 周南》"},
 {n:"林星汉",p:"LIN XING HAN",q:"星汉灿烂，若出其里。",s:"曹操《观沧海》"},
 {n:"林景行",p:"LIN JING XING",q:"高山仰止，景行行止。",s:"《诗经 · 小雅》"},
 {n:"林怀瑾",p:"LIN HUAI JIN",q:"怀瑾握瑜兮。",s:"《楚辞 · 九章》"}
];
const BATCH=6;
const STEP=()=>Math.min(innerWidth*.62,460);
const CARD=()=>STEP()*.82;
document.documentElement.style.setProperty('--cardw',CARD()+'px');

const track=document.getElementById('track');
const progress=document.getElementById('progress');
let panels=[],dots=[];
let pos=0,target=0,total=0;

function makePanel(i){
  const d=NAMES[i%NAMES.length];
  const el=document.createElement('div');el.className='panel';
  el.innerHTML=`<div class="p-idx">第 ${i+1} 帧</div>
    <div class="p-py">${d.p}</div><div class="p-name">${d.n}</div>
    <div class="p-q">${d.q}</div><div class="p-src">—— ${d.s}</div>`;
  el.dataset.index=i;
  el.addEventListener('click',()=>{
    const idx=+el.dataset.index;
    if(Math.round(pos/STEP())!==idx){target=idx*STEP();} // 先吸附到中心
    else{dPy.textContent=d.p;dName.textContent=d.n;
      dSrc.innerHTML=`「${d.q}」<br>—— ${d.s}`;detail.classList.add('show');}
  });
  return el;
}
function appendBatch(){
  for(let i=0;i<BATCH;i++){
    const p=makePanel(total);track.appendChild(p);panels.push(p);
    const dot=document.createElement('i');
    dot.addEventListener('click',()=>{target=total*STEP();});
    progress.appendChild(dot);dots.push(dot);total++;
  }
  hTot.textContent=total;
}
appendBatch();

let snapTimer;
function kick(nudge){
  target+=nudge;
  clearTimeout(snapTimer);
  snapTimer=setTimeout(()=>{target=Math.round(target/STEP())*STEP();},140);
}
// wheel
window.addEventListener('wheel',e=>{
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  kick(d*.9);
},{passive:true});
// drag
let dragging=false,lastX=0;
window.addEventListener('pointerdown',e=>{if(e.target.closest('.detail'))return;dragging=true;lastX=e.clientX;});
window.addEventListener('pointermove',e=>{if(!dragging)return;kick(-(e.clientX-lastX)*1.4);lastX=e.clientX;});
window.addEventListener('pointerup',()=>dragging=false);
// keys
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')kick(STEP());
  if(e.key==='ArrowLeft')kick(-STEP());
});

function loop(){
  pos+=(target-pos)*.12;
  if(Math.abs(target-pos)<.4)pos=target;
  const st=STEP();
  const center=pos/st;
  panels.forEach((p,i)=>{
    const d=i-center;
    const ad=Math.abs(d);
    if(ad>3.2){p.style.visibility='hidden';return;}
    p.style.visibility='visible';
    const ry=d*-38, sc=1-ad*.07, op=1-ad*.22;
    p.style.transform=`translateX(${d*st}px) rotateY(${ry}deg) scale(${Math.max(.7,sc)})`;
    p.style.opacity=Math.max(.25,op);
    p.style.zIndex=100-Math.round(ad);
  });
  const ci=Math.round(center);
  dots.forEach((dot,i)=>dot.classList.toggle('on',i===ci));
  hIdx.textContent=Math.min(total,Math.max(1,ci+1));
  // 倒数第二帧：后台预取下一批
  if(ci>=total-2)appendBatch();
  requestAnimationFrame(loop);
}
loop();

const detail=document.getElementById('detail');
detail.addEventListener('click',()=>detail.classList.remove('show'));
window.addEventListener('resize',()=>location.reload());
</script>
</body>
</html>
